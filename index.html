<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Links — nthe</title>
  <style>
    :root { --bg: #fff; --text: #111; --muted: #555; --rule: #c9c9c9; --tile: #ff9a32; }
    html[data-theme="dark"] { --bg: #111; --text: #f7f7f7; --muted: #bbb; --rule: #494949; --tile: #ff9a32; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; line-height: 1.5; }
    main { width: min(100% - 3rem, 76rem); margin: 0 auto; padding: clamp(3rem, 8vw, 7rem) 0 6rem; }
    h1 { margin: 0; max-width: 13ch; font-size: clamp(3.2rem, 8vw, 6rem); line-height: 1; letter-spacing: -.06em; }
    .intro { max-width: 38rem; margin: 1.5rem 0 0; color: var(--muted); font: 1rem/1.7 ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .layout { display: grid; grid-template-columns: minmax(12rem, 1fr) minmax(0, 2fr); gap: clamp(3rem, 8vw, 8rem); margin-top: clamp(4rem, 9vw, 7rem); }
    h2 { margin: 0 0 1rem; font: 600 .85rem/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace; }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid #c75000; outline-offset: 4px; }
    .link-row { display: flex; justify-content: space-between; gap: 1rem; border-top: 1px solid var(--rule); padding: 1rem 0; text-decoration: none; font-weight: 600; }
    .link-row:hover span:first-child { text-decoration: underline; text-underline-offset: .2em; }
    .talk { display: block; color: inherit; text-decoration: none; }
    .art { position: relative; display: flex; align-items: end; justify-content: space-between; min-height: 14rem; padding: clamp(1.25rem, 3vw, 2rem); background: var(--tile); color: #111; overflow: hidden; }
    .art::after { position: absolute; content: ""; width: 14rem; height: 14rem; top: -4rem; right: 4rem; border: 1px solid #111; transform: rotate(45deg); box-shadow: 1.5rem 1.5rem 0 -1px var(--tile), 1.5rem 1.5rem 0 0 #111, 3rem 3rem 0 -1px var(--tile), 3rem 3rem 0 0 #111; }
    .art-label { position: relative; z-index: 1; font: 600 .8rem/1.4 ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .art-mark { position: relative; z-index: 1; font: 700 2.5rem/1 ui-monospace, monospace; }
    .talk h3 { margin: 1rem 0 .4rem; font-size: clamp(1.5rem, 3vw, 2rem); line-height: 1.15; letter-spacing: -.04em; }
    .talk:hover h3 { text-decoration: underline; text-underline-offset: .15em; }
    .talk p { margin: 0; color: var(--muted); max-width: 42rem; font: .9rem/1.6 ui-monospace, "SFMono-Regular", Consolas, monospace; }
    @media (max-width: 650px) { main { width: calc(100% - 2rem); } .layout { grid-template-columns: 1fr; gap: 3rem; } .art { min-height: 11rem; } }
  </style>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><link rel="stylesheet" href="assets/theme.css">
  <script src="assets/theme.js"></script>
</head>
<body>
  <main>
    <h1>Links, projects and things I make.</h1>
    <p class="intro">Notes, research, and projects from nthe.</p>
    <div class="layout">
      <section aria-labelledby="links-heading">
        <h2 id="links-heading">Links</h2>
        <a class="link-row" href="https://github.com/nthe"><span>GitHub</span><span aria-hidden="true">↗</span></a>
        <a class="link-row" href="https://www.linkedin.com/in/juraj-onu%C5%A1ka-a46b6b31b/"><span>LinkedIn</span><span aria-hidden="true">↗</span></a>
        <a class="link-row" href="https://medium.com/multitude-it-labs"><span>Multitude IT Labs</span><span aria-hidden="true">↗</span></a>
      </section>
      <section aria-labelledby="talks-heading">
        <h2 id="talks-heading">Talks</h2>
        <a class="talk" href="talks/codecon-26/">
          <div class="art" aria-hidden="true"><span class="art-label">CodeCon 26</span><span class="art-mark">&gt;_</span></div>
          <h3>CodeCon 26 - Tokens Under Control</h3>
          <p>Research and experiments on the cost of working with AI models.</p>
        </a>
      </section>
    </div>
  </main>
</body>
</html>
