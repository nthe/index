<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="972pt" height="504pt" viewBox="0 0 972 504" xmlns="http://www.w3.org/2000/svg" version="1.1" role="img" aria-labelledby="chart-title chart-description"><title id="chart-title">Author claims and selected independent results for four products</title><desc id="chart-description">Four rows compare Caveman, Ponytail, Microsoft TokenEconomizer, and Spotify Shunt. The horizontal axis shows percent change. Orange marks author results; blue marks independent results. Solid lines show token volume; dots show cost. The Caveman token mean combines input and output measures. The Spotify Shunt independent result uses a separate inspired implementation. Tests are not matched replications.</desc><rect class="chart-background" x="0" y="0" width="972" height="504" fill="#ffffff"/>
